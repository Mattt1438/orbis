<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbis">
<title>Orbis</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --void:#0b0820;
  --ink:#efeaff;
  --ink-dim:#a9a3cf;
  --glass:rgba(30,24,70,.58);
  --glass-strong:rgba(24,19,58,.86);
  --edge:rgba(200,190,255,.15);
  --you:#7fe0ff;
  --you-ink:#062330;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --void:#0b0820; --ink:#efeaff; --ink-dim:#a9a3cf;
    --glass:rgba(30,24,70,.58); --glass-strong:rgba(24,19,58,.86);
    --edge:rgba(200,190,255,.15); --you:#7fe0ff; --you-ink:#062330;
  }
}
:root[data-theme="dark"]{
  --void:#0b0820; --ink:#efeaff; --ink-dim:#a9a3cf;
  --glass:rgba(30,24,70,.58); --glass-strong:rgba(24,19,58,.86);
  --edge:rgba(200,190,255,.15); --you:#7fe0ff; --you-ink:#062330;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{background:var(--void)}
body{
  position:relative;overflow:hidden;background:var(--void);color:var(--ink);
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--you);outline-offset:3px}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;padding:10px 12px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
.icon-btn{width:44px;height:44px;border-radius:13px;background:var(--glass);border:1px solid var(--edge);color:var(--ink);display:grid;place-items:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:0}
.icon-btn:active{transform:scale(.94)}
#lvl{font-family:Unbounded,Manrope,sans-serif;font-weight:500;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.hud-right{justify-self:end;display:flex;gap:8px;align-items:center}
.pop{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-dim);padding:0 4px;white-space:nowrap}
.pop b{color:var(--you);font-weight:700;font-size:14px}
.pop.full b,.pop.full i{color:#ffc24a}
.pop i{font-style:normal;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-left:4px}
#btnSpeed{width:auto;padding:0 12px;font:700 14px Manrope,sans-serif;font-variant-numeric:tabular-nums}
#power{grid-column:1/-1;height:4px;border-radius:4px;overflow:hidden;display:flex;background:rgba(255,255,255,.06);margin-top:4px;gap:2px}
#power i{display:block;height:100%;flex-basis:0;transition:flex-grow .6s ease;border-radius:2px}
#goalsHud{grid-column:1/-1;min-height:18px;display:flex;justify-content:center;gap:14px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:2px}
#goalsHud span b{color:#ffc24a;font-weight:400;margin-right:4px}
#goalsHud span.miss{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:rgba(255,138,128,.7)}
#goalsHud span.miss b{color:rgba(255,255,255,.28)}

#dock{position:absolute;left:0;right:0;bottom:0;padding:0 12px 12px;display:flex;justify-content:center;pointer-events:none}
.seg{pointer-events:auto;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.seg button{min-width:66px;height:44px;border-radius:999px;border:0;background:transparent;color:var(--ink-dim);font:600 15px Manrope,sans-serif;font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.seg button[aria-checked="true"]{background:var(--you);color:var(--you-ink);font-weight:700}

#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 40px));text-align:center;font-size:15px;line-height:1.4;color:var(--ink);pointer-events:none;opacity:0;transition:opacity .5s;padding:10px 16px;border-radius:16px;background:rgba(11,8,32,.72);border:1px solid var(--edge)}
#hint.on{opacity:.95}

#intro{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .7s ease,transform .7s ease;padding:0 24px}
#intro.on{opacity:1;transform:none}
#introN{font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:46px;letter-spacing:-.01em;text-shadow:0 0 30px rgba(127,224,255,.35)}
#introS{display:inline-block;max-width:340px;margin-top:10px;padding:8px 14px;border-radius:14px;background:rgba(11,8,32,.72);color:var(--ink);font-size:14.5px;line-height:1.45}
#introS:empty{display:none}

/* Screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(120% 80% at 50% 45%,rgba(11,8,32,.25),rgba(11,8,32,.82))}
#menu{background:radial-gradient(110% 70% at 50% 42%,rgba(11,8,32,.05),rgba(11,8,32,.78))}
.title{font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:clamp(64px,19vw,120px);line-height:.9;letter-spacing:-.035em;margin:0;color:#f6f2ff;text-shadow:0 0 42px rgba(127,224,255,.45),0 0 2px rgba(255,255,255,.6);animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;letter-spacing:.12em;filter:blur(6px)}to{opacity:1;letter-spacing:-.035em;filter:none}}
.tagline{color:var(--ink);text-shadow:0 1px 3px var(--void),0 0 16px var(--void),0 0 32px var(--void);font-size:16px;line-height:1.45;margin:16px 0 40px;max-width:30ch}
.primary{min-height:58px;padding:0 34px;border-radius:999px;border:0;background:var(--you);color:var(--you-ink);font:700 17px Manrope,sans-serif;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 12px 44px -12px rgba(127,224,255,.8)}
.primary:active{transform:scale(.97)}
.ghost{min-height:48px;padding:0 24px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:600 15px Manrope,sans-serif;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ghost:active{transform:scale(.97)}
.stack{display:flex;flex-direction:column;gap:12px;align-items:center}
.stepper{display:flex;align-items:center;gap:6px;margin-top:20px;color:var(--ink-dim);font-size:14.5px;font-variant-numeric:tabular-nums}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:600 18px Manrope,sans-serif;padding:0}
.stepper button:disabled{opacity:.3}
.stepper span{min-width:120px}
.stars{color:#ffc24a;letter-spacing:.08em}
.daily-done{color:var(--ink-dim);font-size:14px}
.corner{position:absolute;right:14px;bottom:14px}
.panel{background:var(--glass-strong);border:1px solid var(--edge);border-radius:26px;padding:28px 24px 22px;width:min(340px,100%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.panel h2{font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:30px;margin:0 0 10px;letter-spacing:-.01em}
.panel p{margin:0 0 22px;color:var(--ink-dim);font-size:15px;line-height:1.5}
.panel .primary{width:100%}
.panel .ghost{width:100%}
#cardCv{width:132px;height:132px;display:block;margin:-6px auto 6px}
.row{display:flex;gap:10px;width:100%;justify-content:center}
#pause,#end,#card{justify-content:flex-start;overflow-y:auto}
.panel{margin:auto 0;flex-shrink:0}
.goals{list-style:none;margin:6px 0 16px;padding:0;display:grid;gap:8px;text-align:left}
.goals li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.goals li b{font-size:22px;line-height:1;color:#ffc24a;width:24px;text-align:center;font-weight:400}
.goals li em{margin-left:auto;font-style:normal;font-size:13px;font-weight:700;color:#8dffb0}
.goals li.miss{color:var(--ink-dim)}
.goals li.miss b{color:rgba(255,255,255,.28)}
.goals li.miss em{color:#ff8a80}
@media (max-height:460px){.goals{gap:4px;margin:2px 0 10px}.screen{padding:10px}.panel{padding:16px 20px 14px}.panel h2{font-size:22px;margin-bottom:6px}.panel p{margin-bottom:12px;font-size:14px}.panel .stack{gap:8px}.primary{min-height:46px}.ghost{min-height:40px}#cardCv{width:84px;height:84px;margin:-4px auto 2px}}
@media (prefers-reduced-motion: reduce){.title{animation:none}#intro,#hint{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div><button class="icon-btn" id="btnPause" aria-label="Mettre en pause">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="4" y="3" width="3.6" height="12" rx="1.3" fill="currentColor"/><rect x="10.4" y="3" width="3.6" height="12" rx="1.3" fill="currentColor"/></svg>
  </button></div>
  <div id="lvl">Niveau 1</div>
  <div class="hud-right">
    <span class="pop" id="pop" aria-label="Ta flotte et ta flotte maximale"><b>0</b> / 0</span>
    <button class="icon-btn" id="btnSpeed" aria-label="Vitesse du jeu">×1</button>
  </div>
  <div id="power" aria-hidden="true"></div>
  <div id="goalsHud"><span id="gTime"></span><span id="gSafe"></span></div>
</div>

<div id="dock" hidden>
  <div class="seg" role="radiogroup" aria-label="Part de la flotte envoyée">
    <button role="radio" data-p="0.25">25&#8239;%</button>
    <button role="radio" data-p="0.5">50&#8239;%</button>
    <button role="radio" data-p="0.75">75&#8239;%</button>
    <button role="radio" data-p="1">100&#8239;%</button>
  </div>
</div>

<div id="hint"></div>
<div id="intro"><div id="introN"></div><div id="introS"></div></div>

<div id="menu" class="screen">
  <h1 class="title">orbis</h1>
  <p class="tagline">Prends les planètes une à une. Garde-les.</p>
  <div class="stack">
    <button class="primary" id="play">Commencer</button>
    <button class="ghost" id="daily" hidden>Défi du jour</button>
    <div class="stepper" id="stepper" hidden>
      <button id="lvPrev" aria-label="Niveau précédent">‹</button>
      <span id="lvSel">Niveau 1</span>
      <button id="lvNext" aria-label="Niveau suivant">›</button>
    </div>
  </div>
  <button class="icon-btn corner sound-btn" aria-label="Son"></button>
</div>

<div id="pause" class="screen" hidden>
  <div class="panel">
    <h2>En pause</h2>
    <p id="pauseS">Niveau 1</p>
    <div class="stack">
      <button class="primary" id="pResume">Reprendre</button>
      <button class="ghost" id="pRestart">Recommencer le niveau</button>
      <div class="row">
        <button class="ghost" id="pMenu" style="flex:1">Menu</button>
        <button class="icon-btn sound-btn" aria-label="Son" style="width:48px;height:48px;border-radius:999px"></button>
      </div>
    </div>
  </div>
</div>

<div id="end" class="screen" hidden>
  <div class="panel">
    <h2 id="endT">Victoire</h2>
    <ul class="goals" id="endStars"></ul>
    <p id="endS"></p>
    <div class="stack">
      <button class="primary" id="endGo">Niveau suivant</button>
      <button class="ghost" id="endSkip" hidden>Passer au niveau suivant</button>
      <button class="ghost" id="endMenu">Menu</button>
    </div>
  </div>
</div>

<div id="card" class="screen" hidden>
  <div class="panel">
    <canvas id="cardCv" width="264" height="264"></canvas>
    <h2 id="cardT"></h2>
    <p id="cardS"></p>
    <button class="primary" id="cardOk">Compris</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
